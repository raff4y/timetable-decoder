<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In · Free Room Finder</title>
<meta name="description" content="Log in to the Free Room Finder with the account your admin gave you." />
<meta name="theme-color" content="#0aa0cf" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="/brand/favicon-180.png" />
<link rel="stylesheet" href="/src/styles/brand.css" />
</head>
<body>
<div class="auth">
  <div class="ambient" aria-hidden="true">
    <div class="dot-grid"></div>
    <div class="orb orb--cyan"></div>
    <div class="orb orb--blue"></div>
  </div>

  <header class="auth-header">
    <a class="lockup" href="/rooms/"><img src="/brand/ss-mark.png" alt="" width="33" height="22" />Free Room Finder</a>
    <a class="back-link" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
      Back To Home
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card glass">
      <section class="view" aria-labelledby="signin-title">
        <span class="icon-tile icon-tile--lg">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20.5h16"/><path d="M6 20.5V4.5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v16"/><path d="M14.5 12.5h.01"/></svg>
        </span>
        <div class="view-head">
          <h1 id="signin-title" tabindex="-1">Free Room Finder</h1>
          <p>Log in with the Room Finder account your admin gave you. Your Timetable Decoder login doesn’t work here.</p>
        </div>
        <form id="signin-form" class="view" novalidate>
          <div class="alert" role="alert" data-alert hidden></div>
          <div class="fields">
            <div class="field">
              <label for="signin-username">Username</label>
              <input class="input" id="signin-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your username" required />
            </div>
            <div class="field">
              <label for="signin-password">Password</label>
              <div class="pw-wrap">
                <input class="input" id="signin-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required />
                <button type="button" class="pw-toggle" aria-controls="signin-password" aria-pressed="false" aria-label="Show password">
                  <svg class="icon-show" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-hide" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4"/><path d="M6.4 6.9C3.9 8.6 2.5 12 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4.6-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3 3 18 18"/></svg>
                </button>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn--primary btn--block" data-label="Log In" data-busy-label="Logging In">Log In</button>
          <p class="hint">Accounts are created by an admin; there is no sign-up. Forgot your password? Ask your admin to reset it.</p>
        </form>
      </section>
    </div>
  </main>

  <footer class="auth-footer">A Product By <span class="wordmark">System<span>Solutions</span></span></footer>
</div>

<script type="module" src="/src/rooms/pages/login.js"></script>
</body>
</html>
